[project]
name = "antifaz"
version = "0.1.0"
description = "Privacy gateway for LLMs: pseudonymises Spanish and EU personal data before it reaches the provider and restores it in the answer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Miquel Moreno", email = "miquel.moreno.martinez@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "anyio>=4.0",
    "python-stdnum>=2.2",
]

[project.scripts]
antifaz = "antifaz.cli:main"

[dependency-groups]
dev = [
    "anthropic>=1.9",
    "hypothesis>=6.160",
    "mypy>=1.13",
    "openai>=3.22",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antifaz"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "evals"]
extend-exclude = [".claude"]
# Also when pre-commit passes files one by one: the .claude/ kit keeps its own style.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, and obviously fake secrets used as fixtures.
"tests/**" = ["S101", "S105", "S106"]
# Dev scripts: asserts for invariants; randomness is for fake data, not security.
"scripts/**" = ["S101", "S311"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/antifaz"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
# The privacy pieces need >= 90 %: scripts/check_coverage.py enforces it in CI.
