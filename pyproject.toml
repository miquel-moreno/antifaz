[project]
name = "antifaz"
version = "0.1.0"
description = "Privacy gateway for LLMs: pseudonymises Spanish and EU personal data before it reaches the provider and restores it in the answer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Miquel Moreno", email = "miquel.moreno.martinez@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "anyio>=4.0",
    "python-stdnum>=2.2",
]

[project.optional-dependencies]
# Names and addresses with GLiNER (ADR-0003, ADR-0016). CPU only: torch comes from the PyTorch
# CPU index (see [tool.uv.sources]), never the CUDA wheels. The model itself is downloaded apart,
# pinned by commit and SHA-256 (`make ner-model`).
ner = [
    "gliner>=0.2.29",
    # transformers needs it to read the SentencePiece tokenizer of mDeBERTa (spm.model).
    "protobuf>=5.0",
    "torch>=2.6",
    "transformers>=4.51.3",
]

[project.scripts]
antifaz = "antifaz.cli:main"

[dependency-groups]
dev = [
    "anthropic>=1.9",
    "hypothesis>=6.160",
    "mypy>=1.13",
    "openai>=3.22",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
# Only for the Presidio baseline of Antifaz-Bench (`make bench PRESIDIO=1`, ADR-0011): never
# shipped, not installed by `uv sync` nor in CI. Lower bounds only: the exact versions, the
# ones each result records, are in uv.lock. The spaCy model is the multilingual xx_ent_wiki_sm (MIT), never the GPL-3.0
# es_core_news_* (ADR-0003); it comes from its GitHub release, pinned by uv.lock's SHA-256.
bench = [
    "presidio-analyzer>=2.2.364",
    "spacy>=3.8.16",
    "xx-ent-wiki-sm>=3.8.0",
]

[tool.uv]
# presidio-analyzer wants numpy < 2.5 and the ner extra locks a newer one: two separate
# resolutions, so the bench group never changes what the ner extra ships with. They are never
# needed together (the Presidio baseline reads the NER results from evals/results/).
conflicts = [[{ extra = "ner" }, { group = "bench" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
xx-ent-wiki-sm = { url = "https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl" }

# Only torch comes from here (explicit = true): every other package still comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antifaz"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "evals"]
extend-exclude = [".claude"]
# Also when pre-commit passes files one by one: the .claude/ kit keeps its own style.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, and obviously fake secrets used as fixtures.
"tests/**" = ["S101", "S105", "S106"]
# Dev scripts: asserts for invariants; randomness is for fake data, not security.
"scripts/**" = ["S101", "S311"]
# End-to-end tests drive the docker CLI with fixed argument lists (never a shell).
"tests/e2e/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

# The `ner` extra is not installed in CI, and gliner ships no type hints: the backend
# (detect/ner/gliner.py) type-checks the same with or without them.
[[tool.mypy.overrides]]
module = ["gliner", "gliner.*", "torch", "torch.*"]
ignore_missing_imports = true

# The `bench` group (Presidio baseline) is not installed in CI: evals/presidio_baseline.py imports
# it only inside build_analyzer(). Skipped the same with or without it installed.
[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_analyzer.*", "tldextract", "tldextract.*", "spacy", "spacy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "ner_model: needs the real NER model (skipped unless ANTIFAZ_NER_MODEL_DIR is set; issue 6b)",
    "e2e: needs Docker; builds the image and runs Compose (skipped unless --e2e, `make e2e`; issue 7a)",
]

[tool.coverage.run]
source = ["src/antifaz"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
# The privacy pieces need >= 90 %: scripts/check_coverage.py enforces it in CI.
