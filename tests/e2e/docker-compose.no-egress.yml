# No way out for the e2e stacks: always on top of docker-compose.yml and compose.build.yml,
# for the stack with the fake provider (docker-compose.e2e.yml goes on top of this one) and for
# the stack started with the .env written by `antifaz init` (test_image_cli.py).
#
# The gateway is only on `e2e-internal`, a network with `internal: true`: Docker gives it no
# route outside, so no request can reach a real provider even if a base URL were wrong. Listing
# `networks:` also keeps it off the default network of docker-compose.yml. Docker does not
# publish ports from an internal network, so the `ports:` of docker-compose.yml stays declared
# but is never bound (tests/e2e/test_no_egress.py checks both).
#
# The host reaches the stack through `relay` (tests/e2e/relay.py, standard library, in the
# Antifaz image): it is on `e2e-internal` and on `e2e-edge`, a normal network where Compose
# publishes its ports on 127.0.0.1 only, and it copies bytes from each port to one fixed IP
# inside the internal subnet (no name lookups; a target outside the subnet is refused). It
# never connects where a client asks, so it gives the gateway no way out. The subnet and the
# fixed addresses come from the tests (tests/e2e/egress.py, internal_addresses): one subnet per
# stack, fixed addresses outside the range Docker hands out.
services:
  antifaz:
    networks:
      e2e-internal:
        ipv4_address: ${ANTIFAZ_E2E_GATEWAY_IP:?set by the e2e tests}

  relay:
    image: antifaz:local
    pull_policy: never
    entrypoint: ["python", "/e2e/relay.py"]
    environment:
      E2E_RELAY_ROUTES: "8000=${ANTIFAZ_E2E_GATEWAY_IP}:8000"
      E2E_RELAY_SUBNET: ${ANTIFAZ_E2E_SUBNET:?set by the e2e tests}
    volumes:
      - ./tests/e2e/relay.py:/e2e/relay.py:ro
    ports:
      - "127.0.0.1:${ANTIFAZ_E2E_GATEWAY_PORT:?set by the e2e tests}:8000"
    networks:
      - e2e-internal
      - e2e-edge
    depends_on:
      antifaz:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "/e2e/relay.py", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: "no"

networks:
  e2e-internal:
    internal: true
    # The host gets no address on this bridge (Docker 28 or later), so the containers cannot
    # reach the Docker host's own services either (a proxy on 0.0.0.0 would be a way out).
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${ANTIFAZ_E2E_SUBNET:?set by the e2e tests}
          ip_range: ${ANTIFAZ_E2E_IP_RANGE:?set by the e2e tests}
  e2e-edge: {}
