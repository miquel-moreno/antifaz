name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing by default; each job asks only for what it needs.
permissions: {}

# One run per branch or PR: a new push cancels the previous run of a PR, never of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by full commit SHA (a tag can be moved; a SHA cannot).
# Dependabot keeps them up to date.
env:
  UV_VERSION: "0.13.0"
  PYTHON_VERSION: "3.12"
  ZIZMOR_VERSION: "1.30.1"

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the code
    # A real PostgreSQL 16 for the tests marked `postgres` (virtual keys, PR 8b-1). Pinned by
    # digest; Dependabot does not update `services:` images, so the digest is refreshed by hand
    # (docs/TECNICO.md) and `make test-postgres` reads it from here. Published on 127.0.0.1
    # only, with scram-sha-256 (never trust). The password is a throwaway that only exists in
    # this job: the tests make their own database and a non-superuser role with a random one.
    services:
      postgres:
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c # 16.15
        env:
          POSTGRES_USER: antifaz_ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: antifaz_test_ci
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U antifaz_ci -d antifaz_test_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types (mypy --strict)
        run: uv run mypy src evals
      # --postgres: the PostgreSQL tests run (and FAIL if the service is not reachable).
      - name: Tests
        run: uv run pytest --postgres --cov --cov-report=term-missing --cov-report=json
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: "5432"
          TEST_POSTGRES_USER: antifaz_ci
          TEST_POSTGRES_PASSWORD: ci-only-throwaway
          TEST_POSTGRES_DATABASE: antifaz_test_ci
      # Every piece, db included (a local `make test` without PostgreSQL skips db).
      - name: Coverage >= 90 % in the privacy pieces
        run: uv run python -m scripts.check_coverage

  # The CLI writes files (antifaz init and setup claude-code: O_EXCL temp file, os.replace,
  # backups; %USERPROFILE%\.claude) and talks to a console: Windows behaves differently there,
  # so its tests also run on Windows.
  cli-windows:
    name: CLI tests on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      # `antifaz db` and the database code without PostgreSQL too (8b-1): settings, errors
      # against fake loopback servers, migration files, import isolation (no --postgres here).
      - name: CLI tests
        run: >-
          uv run pytest --no-cov
          tests/unit/test_cli.py tests/unit/test_cli_init.py tests/unit/test_cli_doctor.py
          tests/unit/test_cli_setup_claude_code.py tests/unit/test_cli_db.py
          tests/unit/test_db_checks.py tests/unit/test_db_connect.py tests/unit/test_db_imports.py
          tests/unit/test_db_migrations.py tests/unit/test_db_settings.py
          tests/unit/test_db_sql_rules.py

  # The real panel in a real browser (PR 11c-2a, tests/browser): an in-process gateway on
  # 127.0.0.1 with throwaway tokens, no provider and no network beyond loopback. Chromium only
  # here; Firefox and WebKit run locally (`make panel-check`). No secret is used.
  panel-browser:
    name: Panel in a real browser (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --group panel
      # The version uv.lock installed: the browser build that Playwright release expects.
      - name: Playwright version
        id: playwright
        run: |
          version=$(uv run --frozen --group panel python -c 'from importlib.metadata import version; print(version("playwright"))')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # Downloaded once per Playwright version, then restored. No restore-keys: a new version
      # never starts from another version's browsers.
      - name: Cache of the Chromium headless shell
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-shell
      # Only Chromium's headless shell (about 122 MB: 119.8 MB + ffmpeg 2.4 MB), on a cache miss.
      - name: Chromium headless shell
        if: steps.browser-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.version }}
        run: |
          echo "Chromium headless shell for Playwright ${PLAYWRIGHT_VERSION}"
          uv run --frozen --group panel playwright install --only-shell chromium
      # System libraries only if the runner lacks one (apt, through Playwright's own list).
      - name: System libraries of the headless shell (only if missing)
        run: |
          shell=$(find ~/.cache/ms-playwright -type f -name chrome-headless-shell -print -quit)
          test -n "$shell"
          if ldd "$shell" | grep "not found" >/dev/null; then
            uv run --frozen --group panel playwright install-deps chromium
          fi
      - name: Panel checks
        run: make panel-check PANEL_BROWSERS=chromium
      # Only what the harness writes on a failure: screenshots and logs with every token
      # replaced. Never traces, videos or HAR files (they would hold tokens and cookies).
      - name: Upload the failure screenshots and redacted logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-browser-failures
          path: |
            test-results/panel-browser/*.png
            test-results/panel-browser/*.log
          retention-days: 7
          if-no-files-found: ignore

  supply-chain:
    name: Vulnerabilities and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Known vulnerabilities (uv audit, OSV)
        run: uv audit --frozen --preview-features audit-command
      - name: Licenses of what ships
        run: |
          uv sync --frozen --no-dev
          uv run --no-sync python -m scripts.check_licenses

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
      pull-requests: read # gitleaks-action lists the commits of the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Scans the commits of the push or PR, never the working tree. v3.0.0 always passes
      # --redact to gitleaks (src/gitleaks.js), so the log and the SARIF never hold a secret.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the code; the token also lets zizmor's online audits read public actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      # Auditor persona: also the low-confidence checks. Any finding fails the job.
      - name: zizmor
        run: uvx "zizmor==${ZIZMOR_VERSION}" --persona auditor --format plain .
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    name: Image (build, end-to-end, SBOM, scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # Built locally and loaded into Docker; never pushed (publishing is a separate workflow).
      - name: Build the image
        run: docker buildx build --load --tag antifaz:local .
      # The e2e network isolation (internal network, inhibit_ipv4) depends on these versions.
      - name: Docker versions
        run: |
          docker version
          docker compose version
      # Compose with a fake provider and throwaway keys; never calls a real provider.
      - name: End-to-end tests
        run: make e2e
      - name: SBOM of the image (CycloneDX, uploaded as an artifact)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: antifaz:local
          syft-version: v1.51.1
          format: cyclonedx-json
          artifact-name: antifaz-image.cdx.json
          output-file: antifaz-image.cdx.json
          upload-artifact-retention: 30
          upload-release-assets: false
      # Full report: every vulnerability Grype finds, fixed or not. Never fails; it is
      # uploaded below on every run so nothing is hidden by the gate.
      - name: Vulnerability report of the image (Grype, full, never fails)
        id: grype-report
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: antifaz:local
          grype-version: v0.118.0
          fail-build: false
          only-fixed: false
          output-format: table
          output-file: grype-report.txt
      # The same full report as JSON, for the check below (and uploaded with the table).
      - name: Vulnerability report of the image as JSON (Grype, full, never fails)
        id: grype-json
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: antifaz:local
          grype-version: v0.118.0
          fail-build: false
          only-fixed: false
          output-format: json
          output-file: grype-report.json
      # On distroless, Debian packages are visible only through /var/lib/dpkg/status.d and
      # CPython only through its binary: if the scanners lost them, the gate below would pass
      # for the wrong reason (issue 54, ADR-0019). The structure blocks: Grype sees Debian 13
      # and matches deb packages, the SBOM lists libc6, libssl3t64 and zlib1g as Debian
      # packages and CPython 3.12.x. The known CVE-2026-85091 in zlib1g only warns (Debian may
      # fix or reclassify it). Standard library only.
      - name: Check that the scanners still see the system packages (structure blocks, CVE warns)
        run: python3 -m scripts.check_scan_sees --sbom antifaz-image.cdx.json --grype grype-report.json --distro debian --distro-version 13 --deb libc6 --deb libssl3t64 --deb zlib1g --python 3.12 --warn-vulnerability CVE-2026-85091 --warn-package zlib1g
      # Gate: fails on high or critical only when a fix exists (an upgrade can remove it).
      # .github/grype-gate.yaml lists the few ignored findings, each with its reason.
      - name: Vulnerability gate of the image (Grype, high or critical with a fix)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: antifaz:local
          grype-version: v0.118.0
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          config: .github/grype-gate.yaml
          output-format: table
      # Uploaded even when the gate fails, as long as the report was written.
      - name: Upload the full vulnerability report
        if: always() && steps.grype-report.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-report
          path: |
            grype-report.txt
            grype-report.json
          retention-days: 30
          if-no-files-found: error
