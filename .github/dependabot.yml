version: 2
updates:
  # cooldown: a new release waits 7 days before Dependabot proposes it, so a hijacked
  # release is usually caught and pulled first. Security updates are not delayed.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"

  # Base images of the Dockerfile, pinned by digest (python and uv): a new digest of the same
  # tag (Debian security rebuilds) is proposed as a PR. No `docker-compose` entry: the compose
  # files only use Antifaz's own image (the published one, or antifaz:local built from this
  # Dockerfile), whose version moves with each release (a test ties it to pyproject.toml).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
