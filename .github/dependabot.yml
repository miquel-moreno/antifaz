version: 2
updates:
  # cooldown: a new release waits 7 days before Dependabot proposes it, so a hijacked
  # release is usually caught and pulled first. Security updates are not delayed.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"

  # Base images of the Dockerfile, pinned by digest (python, distroless and uv): a new digest of
  # the same tag (Debian security rebuilds) is proposed as a PR. For a tag that is not a version
  # (distroless `nonroot`) Dependabot keeps the tag and refreshes the digest; for registries
  # other than Docker Hub it has no publication date, so the cooldown does not apply there.
  # python and distroless arrive as separate PRs: tests/unit/test_container_files.py fails if
  # they stop naming the same Debian release (ADR-0019). No `docker-compose` entry: the compose
  # files only use Antifaz's own image (the published one, or antifaz:local built from this
  # Dockerfile), whose version moves with each release (a test ties it to pyproject.toml).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Antifaz stays on Python 3.12: the distroless image copies CPython from this base
    # (ADR-0019), so moving to 3.13+ is a deliberate change with its own tests, not a bot PR.
    # Only major/minor bumps are ignored: new digests and 3.12.x patch tags still arrive.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "build(deps)"
