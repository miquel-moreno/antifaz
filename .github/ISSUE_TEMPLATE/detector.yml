name: Wrong detection
description: Text that Antifaz flags by mistake, or flags with the wrong type
labels: [detection]
body:
  - type: markdown
    attributes:
      value: |
        Use invented data only. For identifiers, generate a valid one with its algorithm.
        A value that Antifaz **misses** goes in the "I found a leak" template instead.
  - type: input
    id: type
    attributes:
      label: Type of data (e.g. ES_NIE, IBAN, address)
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example text (invented) and what Antifaz did
    validations:
      required: true
