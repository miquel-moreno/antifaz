<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" role="img" aria-label="Antifaz">
  <title>Antifaz</title>
  <!-- Project logo (issue #30, adopted by Miquel on 2026-10-07): the white mask in a rounded tile with an indigo
       gradient (155deg, #7363f7 to #3b2db0) and a faint inner edge. The mask is one path
       with the eyes cut out (evenodd); the eyes are slightly larger than in the first
       sample so they still read at 16 px. Single-colour version: design/logo-mark.svg. -->
  <defs>
    <linearGradient id="antifaz-tile" x1="0.29" y1="0.05" x2="0.71" y2="0.95">
      <stop offset="0" stop-color="#7363f7"/>
      <stop offset="1" stop-color="#3b2db0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9.6" fill="url(#antifaz-tile)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="9.1" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>
  <path transform="translate(0.08 0.52) scale(0.4423)" fill="#ffffff" fill-rule="evenodd" d="M12 32c0-6 6-8 12-8 5 0 8 3 12 3s7-3 12-3c6 0 12 2 12 8 0 8-6 14-13 14-5 0-8-4-11-4s-6 4-11 4c-7 0-13-6-13-14zM19 34a6 4.5 0 1 0 12 0a6 4.5 0 1 0-12 0zM41 34a6 4.5 0 1 0 12 0a6 4.5 0 1 0-12 0z"/>
</svg>
