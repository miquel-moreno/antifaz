# Antifaz with Docker Compose, from the published image (ADR-0017). In an empty folder:
#   docker run --rm -it -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" --network none \
#     ghcr.io/miquel-moreno/antifaz:<version> init       # writes .env (needs 0.2.0 or later)
#   docker compose up -d
# Or by hand: `cp .env.example .env` and fill in your keys. To build the image from this clone
# instead: `make up` (adds compose.build.yml). Details in docs/TECNICO.md ("Docker").
#
# The keys are read from .env when the container starts: they are never baked into the image
# and never written in this file.
#
# Tip: keep "$" out of the values in .env (Compose would try to expand it). Keys written by
# `antifaz init` or made with `openssl rand -hex 32` are fine.
name: antifaz

services:
  antifaz:
    # In the repository: the last release, or ANTIFAZ_VERSION=X.Y.Z. The copy attached to each
    # GitHub release is pinned by digest instead (image: ...:X.Y.Z@sha256:...).
    # No `command:`: the image runs `antifaz serve` by default.
    image: ghcr.io/miquel-moreno/antifaz:${ANTIFAZ_VERSION:-0.1.0}
    env_file:
      # ANTIFAZ_ENV_FILE lets the end-to-end tests use a throwaway file instead of your .env.
      - path: ${ANTIFAZ_ENV_FILE:-.env}
        required: true
    # Every setting comes from that file (no `environment:` here to override it). The host
    # names in .env.example include "antifaz", the service name, so other containers on the
    # same Compose network reach it at http://antifaz:8000.
    # Only this machine can reach it. To expose it to a network, put a reverse proxy with HTTPS
    # in front (docs/TECNICO.md) instead of publishing the port on 0.0.0.0.
    ports:
      - "127.0.0.1:${ANTIFAZ_PORT:-8000}:8000"
    # Hardening: nothing in the container can be changed, no Linux capabilities, no privilege
    # escalation, and bounded memory, CPU and processes.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-m", "antifaz.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s
    stop_grace_period: 25s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
