# Remote hooks are pinned by commit SHA, like the CI actions.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # The font licences in design/fonts/ stay byte-identical to the upstream release
      # (their SHA-256 is recorded in design/README.md).
      - id: trailing-whitespace
        exclude: ^design/fonts/.*-OFL\.txt$
      - id: end-of-file-fixer
        exclude: ^design/fonts/.*-OFL\.txt$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  # The project's own ruff (uv.lock), so pre-commit and CI always agree.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, markdown]
      # Names that must never appear (text, file names, image metadata; never pixels). The list
      # is private and lives outside the repo (ANTIFAZ_FORBIDDEN_NAMES_FILE, by default
      # ../_privado/forbidden-names.txt); without it the hook fails and says where to put it,
      # except in CI (CI=true), where it only warns.
      - id: forbidden-names
        name: forbidden names (list kept outside the repo)
        entry: uv run python -m scripts.check_forbidden_names
        language: system
        types: [file]
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # The hook runs `gitleaks git --pre-commit --redact --staged`: staged changes only, redacted.
      - id: gitleaks
  # Security audit of the workflows, dependabot.yml and this file. Offline: no token needed;
  # CI also runs the online audits.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: ["--no-progress", "--offline", "--persona", "auditor"]
